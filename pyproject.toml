[project]
name = "jalsathi"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.163.1",
    "pydantic==2.14.3",
    "python-multipart==0.0.33",
    "SQLAlchemy==2.1.8",
    "psycopg[binary]==3.3.9",
    "pandas==2.3.3",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "scikit-learn==1.8.0",
    "joblib==1.6.0",
    "reportlab==5.1.0",
]

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = ["reports/eda", ".venv"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.vercel]
entrypoint = "main:app"

[tool.vercel.fastapi.static]
cdn = true
exclude = false
